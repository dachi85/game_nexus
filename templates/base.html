<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Game Store{% endblock %}</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e1e1e;
            padding: 15px 30px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        a { color: #00adb5; text-decoration: none; }
        a:hover { color: #00fff5; }
        h1 { color: #00adb5; }

        .budget-filter {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .budget-filter input[type="number"] {
            padding: 10px;
            background-color: #333;
            border: 1px solid #444;
            border-radius: 5px;
            color: white;
            width: 150px;
        }
        .budget-filter button {
            width: auto;
            padding: 10px 20px;
        }

        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }
        .game-card {
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .game-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #333;
        }
        .game-details {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .game-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .game-meta {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        .game-price {
            font-size: 1.3rem;
            color: #00fff5;
            font-weight: bold;
            margin-top: auto;
            margin-bottom: 15px;
        }
        .card-actions {
            display: flex;
            justify-content: space-between;
        }

        .form-container {
            max-width: 500px;
            margin: 50px auto;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
        }
        label { display: block; margin-bottom: 8px; }
        input[type="text"], input[type="number"] {
            width: 100%; padding: 10px; margin-bottom: 20px;
            background-color: #333; border: 1px solid #444;
            border-radius: 5px; color: #fff; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 12px; background-color: #00adb5;
            border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer;
        }
        button:hover { background-color: #00fff5; color: #1a1a1a; }
        .btn-add-main {
            display: inline-block; background-color: #00adb5; color: white;
            padding: 12px 25px; border-radius: 5px; font-weight: bold; margin-bottom: 20px;
        }
        .delete { color: #ff2e63; }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Game Nexus</title>
</head>
<body>
    <div>
        <p>Welcome, {{ username }}!</p>
        {% if username == 'Guest' %}
            <a href="/login">Login</a>
        {% else %}
            <a href="/logout">Logout</a>
        {% endif %}
    </div>
    <hr>

    <h1>Game Nexus - My Collection</h1>
    <ul>
        {% for game in games %}
            <li>
                <strong>{{ game.title }}</strong> ({{ game.platform }}) - <em>{{ game.status }}</em>
                | <a href="{{ url_for('edit_game', id=game.id) }}">Edit</a>
                | <a href="{{ url_for('delete_game', id=game.id) }}" onclick="return confirm('Are you sure?')">Delete</a>
            </li>
        {% endfor %}
    </ul>
    <br>
    <a href="/add">Add New Game</a>
</body>
</html>

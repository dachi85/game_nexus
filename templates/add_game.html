<!DOCTYPE html>
<html>
<head>
    <title>Add New Game</title>
</head>
<body>
    <h1>Add New Game</h1>
    <form method="POST">
        <label>Title:</label><br>
        <input type="text" name="title" placeholder="Game Title" required><br><br>

        <label>Platform:</label><br>
        <input type="text" name="platform" placeholder="e.g. PC, PS5, Xbox" required><br><br>

        <label>Status:</label><br>
        <input type="text" name="status" placeholder="e.g. Playing, Completed" required><br><br>

        <button type="submit">Add Game</button>
    </form>
    <br>
    <a href="/">Back to Home</a>
</body>
</html>

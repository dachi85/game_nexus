{% extends 'base.html' %}

{% block title %}Add New Game{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Add New Game to Store</h1>
    <form method="POST">
        <label>Title:</label>
        <input type="text" name="title" placeholder="Game Title" required>

        <label>Platform:</label>
        <input type="text" name="platform" placeholder="e.g. PC, PS5" required>

        <label>Status:</label>
        <input type="text" name="status" placeholder="e.g. In Stock, Out of Stock" required>

        <label>Price ($):</label>
        <input type="number" step="0.01" name="price" placeholder="e.g. 59.99" required>

        <label>Image URL:</label>
        <input type="text" name="image_url" placeholder="Paste image address link">

        <button type="submit">Add Product</button>
    </form>
    <br>
    <a href="/">Back to Store</a>
</div>
{% endblock %}

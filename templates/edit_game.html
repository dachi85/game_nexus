{% extends 'base.html' %}

{% block title %}Edit Game{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Edit Store Product</h1>
    <form method="POST">
        <label>Title:</label>
        <input type="text" name="title" value="{{ game.title }}" required>

        <label>Platform:</label>
        <input type="text" name="platform" value="{{ game.platform }}" required>

        <label>Status:</label>
        <input type="text" name="status" value="{{ game.status }}" required>

        <label>Price ($):</label>
        <input type="number" step="0.01" name="price" value="{{ game.price }}" required>

        <label>Image URL:</label>
        <input type="text" name="image_url" value="{{ game.image_url }}">

        <button type="submit">Update Product</button>
    </form>
    <br>
    <a href="/">Back to Store</a>
</div>
{% endblock %}

<!DOCTYPE html>
<html>
<head>
    <title>Flask Product List</title>
    <style>
        table { width: 50%; border-collapse: collapse; }
        th, td { border: 1px solid black; padding: 8px; text-align: left; }
        th { background-color: lightgrey; }
    </style>
</head>
<body>

    <h2>Product Inventory</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
        </tr>

        {% for item in products_list %}
        <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.name }}</td>
            <td>{{ item.price }} USD</td>
        </tr>
        {% endfor %}
        </table>

    <p><a href="/api/products">View JSON API</a></p>

</body>
</html>
